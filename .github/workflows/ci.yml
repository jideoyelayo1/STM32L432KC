name: Emulator verification
on:
  push:
    branches: ['**']
    tags: ['demo-v*']
  pull_request:
permissions:
  contents: read
jobs:
  core-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Stm32Emulator.Core.Tests -c Release --verbosity minimal
      - run: dotnet publish src/Stm32Emulator.Web -c Release -o artifacts/browser
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: |
            artifacts/browser-tests
            artifacts/browser-proofs
          if-no-files-found: ignore
      - run: python3 scripts/package-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: stm32-browser
          path: artifacts/stm32-browser.tar.gz
          if-no-files-found: error
  reference-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang qemu-system-arm build-essential
      - run: python3 scripts/reference/generate-cpu-vectors.py --check
      - run: python3 scripts/reference/generate-float-vectors.py --check
      - run: python3 scripts/reference/generate-fpu-instruction-vectors.py --check
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build test1/test1.csproj -c Release
  release:
    if: startsWith(github.ref, 'refs/tags/demo-v')
    needs: [core-and-browser, desktop, reference-vectors]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stm32-browser
          path: artifacts
      - name: Publish verified browser archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEMO_TAG: ${{ github.ref_name }}
        run: gh release create "$DEMO_TAG" artifacts/stm32-browser.tar.gz --title "STM32 browser lab $DEMO_TAG" --notes "Shared C# educational emulator, Windows adapter, browser lab and regression tests. See README and docs/model.md for supported behavior and limitations."
